name: Release Build

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.10.0)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: darwin-arm64
            npm_suffix: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: darwin-x86_64
            npm_suffix: darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64
            npm_suffix: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            name: linux-arm64
            npm_suffix: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            npm_suffix: win32-x64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.name != 'windows-x86_64'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../ast-index-${{ env.RELEASE_TAG }}-${{ matrix.name }}.tar.gz ast-index

      - name: Package (windows)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/ast-index.exe" -DestinationPath "ast-index-${{ env.RELEASE_TAG }}-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ast-index-${{ matrix.name }}
          path: ast-index-${{ env.RELEASE_TAG }}-${{ matrix.name }}.*

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Copy binary to npm platform package (unix)
        if: matrix.name != 'windows-x86_64'
        run: cp target/${{ matrix.target }}/release/ast-index npm/platforms/${{ matrix.npm_suffix }}/bin/ast-index

      - name: Copy binary to npm platform package (windows)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/ast-index.exe" "npm/platforms/${{ matrix.npm_suffix }}/bin/ast-index.exe"

      - name: Publish npm platform package
        run: cd npm/platforms/${{ matrix.npm_suffix }} && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: artifacts/*

  publish-npm:
    name: Publish npm base package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish base package
        run: cd npm && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  crate-release-state:
    name: Check crates.io release state
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.version }}
      exists: ${{ steps.registry.outputs.exists }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify tag matches package version
        id: package-version
        run: |
          actual=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ast-index") | .version')
          test "v${actual}" = "${RELEASE_TAG}"
          echo "version=${actual}" >> "$GITHUB_OUTPUT"

      - name: Check whether version already exists
        id: registry
        env:
          VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 3 --retry-all-errors \
            --header 'User-Agent: ast-index-release-workflow (https://github.com/defendend/Claude-ast-index-search)' \
            "https://crates.io/api/v1/crates/ast-index/${VERSION}")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected crates.io response: HTTP ${status}" >&2; exit 1 ;;
          esac

  publish-crate:
    name: Publish crates.io package
    needs: crate-release-state
    if: needs.crate-release-state.outputs.exists != 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify package
        run: cargo publish --dry-run --locked -p ast-index

      # Configure the `crates-io` environment with required reviewers and add
      # this workflow as the crate's trusted publisher before enabling releases.
      # The first-ever publication must reserve the crate name separately;
      # no long-lived registry token is stored in this repository.
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish package
        run: cargo publish --locked -p ast-index
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  smoke-install-crate:
    name: Smoke cargo install (${{ matrix.os }})
    needs: [crate-release-state, publish-crate]
    if: >-
      ${{
        always() &&
        needs.crate-release-state.result == 'success' &&
        (needs.publish-crate.result == 'success' || needs.publish-crate.result == 'skipped')
      }}
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install released crate
        shell: bash
        env:
          VERSION: ${{ needs.crate-release-state.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if cargo install ast-index --version "$VERSION" --locked; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "crates.io has not served ast-index ${VERSION} yet; retrying in 10 seconds..."
              sleep 10
            fi
          done
          exit 1

      - name: Verify installed binary
        shell: bash
        env:
          VERSION: ${{ needs.crate-release-state.outputs.version }}
        run: |
          output=$(ast-index version)
          echo "$output"
          test "$output" = "ast-index v${VERSION}"

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download archives and compute sha256
        id: sha
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          for platform in darwin-arm64 darwin-x86_64 linux-x86_64 linux-arm64; do
            curl -L -o "ast-index-${platform}.tar.gz" \
              "https://github.com/${REPO}/releases/download/${TAG}/ast-index-${TAG}-${platform}.tar.gz"
            hash=$(sha256sum "ast-index-${platform}.tar.gz" | cut -d ' ' -f1)
            echo "${platform}=${hash}" >> "$GITHUB_OUTPUT"
          done

      - name: Clone homebrew tap
        run: git clone --depth 1 https://github.com/defendend/homebrew-ast-index.git homebrew-tap

      - name: Update formula
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ env.RELEASE_TAG }}
          SHA_DARWIN_ARM64: ${{ steps.sha.outputs.darwin-arm64 }}
          SHA_DARWIN_X86_64: ${{ steps.sha.outputs.darwin-x86_64 }}
          SHA_LINUX_X86_64: ${{ steps.sha.outputs.linux-x86_64 }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.linux-arm64 }}
        run: |
          cat > Formula/ast-index.rb << FORMULA
          class AstIndex < Formula
            desc "Fast code search CLI for Android, iOS, TypeScript, Rust, Ruby, C#, Python, Go, Perl, C++ projects"
            homepage "https://github.com/defendend/Claude-ast-index-search"
            license "MIT"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/defendend/Claude-ast-index-search/releases/download/${TAG}/ast-index-${TAG}-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "https://github.com/defendend/Claude-ast-index-search/releases/download/${TAG}/ast-index-${TAG}-darwin-x86_64.tar.gz"
                sha256 "${SHA_DARWIN_X86_64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/defendend/Claude-ast-index-search/releases/download/${TAG}/ast-index-${TAG}-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "https://github.com/defendend/Claude-ast-index-search/releases/download/${TAG}/ast-index-${TAG}-linux-x86_64.tar.gz"
                sha256 "${SHA_LINUX_X86_64}"
              end
            end

            def install
              bin.install "ast-index"
            end

            test do
              assert_match "ast-index v${VERSION}", shell_output("#{bin}/ast-index version")
            end
          end
          FORMULA

      - name: Commit and push
        working-directory: homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ast-index.rb
          git diff --staged --quiet && echo "Formula already up to date" && exit 0
          git commit -m "Update to ${{ env.RELEASE_TAG }}"
          git remote set-url origin "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/defendend/homebrew-ast-index.git"
          git push origin HEAD:main

  update-winget:
    name: Update Winget Package
    needs: release
    runs-on: windows-latest
    steps:
      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Update winget manifest
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: defendend.ast-index
          version: ${{ steps.version.outputs.version }}
          installers-regex: 'windows-x86_64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
